name: CI

on:
  push:

permissions:
  contents: read
  packages: write

jobs:
  container:
    runs-on: [self-hosted, Linux, X64, ipsos-devops-01, opensuse, podman]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build container
        run: podman build -f Containerfile -t localhost/astra-ci:${GITHUB_SHA} .

      - name: Smoke test
        run: |
          podman rm -f astra-ci >/dev/null 2>&1 || true
          podman run -d --name astra-ci -p 127.0.0.1:18080:80 localhost/astra-ci:${GITHUB_SHA}
          sleep 2
          curl --fail --silent http://127.0.0.1:18080/ >/dev/null
          curl --fail --silent http://127.0.0.1:18080/p1/website/homepage/ >/dev/null
          podman rm -f astra-ci
          echo "Container smoke test passed"

      - name: Publish image to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io --username "${{ github.actor }}" --password-stdin
          podman tag localhost/astra-ci:${GITHUB_SHA} ghcr.io/iis-design/astra:${GITHUB_SHA}
          podman push ghcr.io/iis-design/astra:${GITHUB_SHA}
          echo "Published ghcr.io/iis-design/astra:${GITHUB_SHA}"
